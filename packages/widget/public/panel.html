<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Assistant</title>
<!--
  The sandboxed conversation panel.

  Served from the platform origin, so under CHIPS partitioning it gets a
  per-top-site cookie jar: visitor identity does not and cannot follow a person
  across tenant sites (section 26.1). That is the correct privacy outcome and is
  stated as a design principle rather than worked around.

  Nothing here decides anything consequential. The panel renders, and the
  governed control plane decides.

  What the independent audit found here, and what changed:

    UX-1  there was no close button and no way out from the keyboard. Escape was
          bound on the *host* document, and this panel is a cross-origin iframe,
          so a keyboard or screen-reader user who opened the assistant was
          trapped until they reloaded the page, WCAG 2.2 failures 2.1.2 and
          2.4.3 behind a README that claimed AA. There is now a close control in
          the header, Escape is handled in here, focus is moved to the heading
          on open and handed back to the launcher on close.
    UX-2  the only feedback while the model thought was a disabled Send button.
          There is now a typing indicator on submit and sentence-level streaming
          over SSE, each sentence validated before it is sent.
    UX-4  the session id was a variable in an iframe destroyed on every page
          navigation, so the thread reset silently, and every reset opened a
          new session, which inflated the tenant's conversation meter. It is now
          held in partitioned sessionStorage and the transcript is replayed from
          the server.
    UX-5  a 400px desktop card on a phone. Below 640px the panel is full screen,
          with safe-area padding and visualViewport handling so the on-screen
          keyboard does not cover the composer.
    UX-6  every string but the disclosure was inline English. They now come from
          a locale bundle, and the consent wording that is recorded as evidence
          is the wording the visitor actually saw.
    UX-7  an escalation was a sentence and a dead end. The turn returns a
          structured next action, rendered as a card.
    UX-8  a single hardcoded consent sentence with no explanation, no privacy
          link and no way to withdraw. All three are here now.
    UX-10 no retry on a failed send, no timestamps, no branding beyond an accent
          colour.
-->
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="head-main">
      <h1 id="title" tabindex="-1">
        <span class="lockup">
          <img id="avatar" class="avatar" alt="" hidden>
          <svg id="mark" viewBox="0 0 32 20" width="26" height="16" role="img" aria-label="Detent" focusable="false">
            <circle cx="6" cy="10" r="5" fill="var(--amber)"/>
            <path d="M27 3 L18 10 L27 17" fill="none" stroke="currentColor" stroke-width="2.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="assistant-name">Detent</span>
        </span>
      </h1>
      <!-- Article 50: present in the surface, on the first screen, always. -->
      <p class="disclosure" id="disclosure">You are chatting with an AI assistant, not a person.</p>
    </div>
    <!-- UX-1. A visible, keyboard-reachable way out, inside the iframe where
         the visitor's focus actually is. -->
    <button type="button" class="icon-button" id="close" aria-label="Close">&#x2715;</button>
  </header>

  <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>

  <div class="consent" id="consent" hidden>
    <span id="consent-wording"></span>
    <details>
      <summary id="consent-explain">What does this mean?</summary>
      <p id="consent-explain-body"></p>
    </details>
    <div class="actions">
      <button type="button" id="consent-yes">Yes</button>
      <button type="button" id="consent-no">No</button>
      <a id="privacy-link" href="#" hidden target="_blank" rel="noopener noreferrer">Privacy notice</a>
    </div>
  </div>

  <form id="composer">
    <label class="sr-only" for="message" id="message-label">Your message</label>
    <input type="text" id="message" name="message" autocomplete="off" placeholder="Type your message" required>
    <button type="submit" class="send" id="send">Send</button>
  </form>

  <footer class="tools">
    <!-- UX-8. A persistent withdrawal control, not a one-off prompt. -->
    <button type="button" id="forget">Forget me</button>
  </footer>

<script type="module" src="panel.js"></script>
</body>
</html>
