<title>Engage Walkthrough</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A single committed look. This is a stage: it is projected in a room and
   shown alongside the product, whose own palette it borrows. Flipping to a
   light ground halfway through a presentation would be worse than ignoring
   the host theme, so every colour is painted explicitly and nothing is left
   to inherit. */
:root{
  --ink:#0B1622; --panel:#111F2F; --panel-2:#16273A; --edge:#22364C;
  --amber:#EFA13C; --amber-dim:#8A5A16;
  --paper:#F4F7FA; --mute:#93A6BB; --slate:#6C819A;
  --ok:#54C98E; --warn:#EFA13C; --bad:#E86F6F;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.6 var(--body);
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%;
  padding-bottom:84px}

/* ---- the running order. Numbered because it is genuinely a sequence: the
       scenes are shown in this order and each builds on the last. ---- */
.rail{background:var(--panel);border-right:1px solid var(--edge);
  padding:22px 0 26px;position:sticky;top:env(safe-area-inset-top,0px);
  align-self:start;max-height:100vh;overflow-y:auto}
.mark{display:flex;align-items:baseline;gap:9px;padding:0 20px 4px}
.mark .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
  transform:translateY(-2px);flex:none}
.mark b{font:500 17px/1 var(--body);letter-spacing:-.01em}
.mark span{font:400 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate)}
.rail h2{font:500 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate);margin:22px 20px 9px}
.rail ol{list-style:none;margin:0;padding:0}
.rail button.scene{display:grid;grid-template-columns:26px 1fr;gap:10px;width:100%;
  text-align:left;background:none;border:0;border-left:2px solid transparent;
  padding:8px 20px 8px 18px;color:var(--mute);font:400 13.5px/1.35 var(--body);
  cursor:pointer;align-items:baseline}
.rail button.scene:hover{background:var(--panel-2);color:var(--paper)}
.rail button.scene .num{font:500 11px/1.35 var(--mono);color:var(--slate);
  font-variant-numeric:tabular-nums}
.rail button.scene[aria-current="true"]{background:var(--panel-2);color:var(--paper);
  border-left-color:var(--amber)}
.rail button.scene[aria-current="true"] .num{color:var(--amber)}
.rail button.scene .seat{display:block;font-size:11px;color:var(--slate);margin-top:2px}

/* ---- the stage ---- */
.stage{min-width:0;padding:26px 30px 40px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.head .n{font:500 12px/1 var(--mono);color:var(--amber);letter-spacing:.06em;
  font-variant-numeric:tabular-nums}
.head h1{font:400 30px/1.15 var(--display);letter-spacing:-.015em;margin:0;
  text-wrap:balance;flex:1 1 320px}
.chip{font:500 10.5px/1 var(--body);letter-spacing:.11em;text-transform:uppercase;
  color:var(--mute);border:1px solid var(--edge);border-radius:999px;padding:5px 10px}

.viewer{background:#050C14;border:1px solid var(--edge);border-radius:10px;
  overflow:hidden;position:relative}
.viewer .frame{max-height:62vh;overflow-y:auto;overscroll-behavior:contain}
.viewer .frame.film{overflow:hidden;display:block}
.viewer video{width:100%;display:block;background:#050C14}
.caption .live{display:inline-block;font:500 9.5px/1 var(--body);letter-spacing:.13em;
  text-transform:uppercase;color:#0B1622;background:var(--amber);border-radius:3px;
  padding:4px 6px;margin-right:9px;vertical-align:1px}
.viewer img{width:100%}
.caption{border-top:1px solid var(--edge);background:var(--panel);
  padding:10px 14px;font-size:13px;color:var(--mute)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{background:var(--panel);border:1px solid var(--edge);border-radius:6px;
  padding:0;width:74px;height:46px;overflow:hidden;cursor:pointer;position:relative}
.thumbs button::after{content:attr(data-n);position:absolute;left:4px;bottom:3px;
  font:500 10px/1 var(--mono);color:var(--paper);background:rgba(11,22,34,.82);
  border-radius:3px;padding:2px 4px}
.thumbs button[aria-current="true"]::after{background:var(--amber);color:#0B1622}
.thumbs button[aria-current="true"]{border-color:var(--amber)}
.thumbs img{height:100%;object-fit:cover;object-position:top center;opacity:.75}
.thumbs button[aria-current="true"] img{opacity:1}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:22px;
  align-items:start}
.narration{font:400 16px/1.65 var(--body);color:#DCE6F0;max-width:66ch}
.narration p{margin:0 0 .85em}
.narration p:last-child{margin:0}
.narration em{color:var(--amber);font-style:normal;font-weight:500}
.aside{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px 18px}
.aside h3{font:500 10.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate);margin:0 0 11px}

/* ---- the spoken conversation. Two speakers, two sides, one play control
       each, so a line can be replayed on its own in the room. ---- */
.turns{display:flex;flex-direction:column;gap:10px}
.turn{display:flex;gap:10px;align-items:flex-start;max-width:86%}
.turn.visitor{align-self:flex-end;flex-direction:row-reverse}
.turn .bubble{border-radius:10px;padding:10px 13px;font-size:14px;line-height:1.55}
.turn.assistant .bubble{background:var(--panel-2);border:1px solid var(--edge)}
.turn.visitor .bubble{background:#1D3350;border:1px solid #2A4868}
.turn .who{font:500 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;
  color:var(--slate);display:block;margin-bottom:5px}
.play{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--edge);
  background:var(--panel);color:var(--amber);cursor:pointer;font-size:12px;line-height:1;
  display:grid;place-items:center;margin-top:3px}
.play:hover{border-color:var(--amber)}
.play[data-state="playing"]{background:var(--amber);color:#0B1622;border-color:var(--amber)}
.play[disabled]{opacity:.35;cursor:not-allowed;color:var(--slate)}

pre.json{background:#050C14;border:1px solid var(--edge);border-radius:8px;
  padding:13px 15px;overflow-x:auto;font:400 12px/1.6 var(--mono);color:#BFD2E4;margin:0 0 12px}
pre.json b{color:var(--amber);font-weight:500}
pre.json i{color:var(--ok);font-style:normal}
.jsonlabel{font:500 11px/1 var(--mono);color:var(--slate);margin:0 0 6px;
  letter-spacing:.04em}

table.personas{width:100%;border-collapse:collapse;font-size:13.5px}
table.personas th{text-align:left;font:500 10.5px/1 var(--body);letter-spacing:.11em;
  text-transform:uppercase;color:var(--slate);padding:0 12px 9px 0;vertical-align:bottom}
table.personas td{padding:10px 12px 10px 0;border-top:1px solid var(--edge);
  vertical-align:top;color:#CBD9E7}
table.personas td.who{color:var(--paper);font-weight:500}
table.personas td.cannot{color:var(--mute)}
table.personas td.cannot::before{content:"✕ ";color:var(--bad)}
table.personas td.can::before{content:"✓ ";color:var(--ok)}
.tablewrap{overflow-x:auto}

.notice{border-left:2px solid var(--amber);padding:2px 0 2px 13px;color:var(--mute);
  font-size:13.5px;margin:0}

/* ---- transport ---- */
.transport{position:fixed;left:0;right:0;bottom:0;background:rgba(11,22,34,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--edge);
  padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:14px;z-index:20}
.transport .tbtn{background:var(--panel-2);border:1px solid var(--edge);color:var(--paper);
  border-radius:7px;padding:8px 13px;font:500 13px/1 var(--body);cursor:pointer}
.transport .tbtn:hover{border-color:var(--slate)}
.transport .tbtn.primary{background:var(--amber);border-color:var(--amber);color:#0B1622}
.transport .now{flex:1;min-width:0;font-size:13px;color:var(--mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport .now b{color:var(--paper);font-weight:500}
.transport .keys{font-size:11.5px;color:var(--slate);white-space:nowrap}
.bar{position:absolute;left:0;top:-1px;height:2px;background:var(--amber);width:0;
  transition:width .2s linear}

.audiomsg{font-size:12px;color:var(--amber);border:1px dashed var(--amber-dim);
  border-radius:6px;padding:7px 10px;background:rgba(239,161,60,.07)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--edge)}
  .rail ol{display:flex;overflow-x:auto;gap:2px;padding:0 12px 6px}
  .rail button.scene{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent;
    padding:8px 12px;grid-template-columns:auto}
  .rail button.scene .seat{display:none}
  .rail button.scene[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--amber)}
  .cols{grid-template-columns:1fr}
  .stage{padding:20px 16px 34px}
  .head h1{font-size:24px}
  .viewer .frame{max-height:48vh}
  .transport .keys{display:none}
}
</style>

<script>window.__DEMO__={"scenes":[{"n":1,"title":"The claim","seat":"All","audio":"audio/01-claim.mp3","shots":["shots/01-marketing-home.png"],"caption":"The public site. Nothing behind it yet.","text":"Every company in this room has a website that takes enquiries, and a CRM that takes records, and between them a gap that nobody owns. A visitor arrives at two in the morning with a real problem and a real budget, types it into a box, and what happens next is a form submission, a queue, and a reply eleven hours later to someone who has already spoken to your competitor.\n\nThe usual answer is a chatbot. The reason you have not bought one is that a chatbot will say anything. It will invent a price, promise a delivery date, and enrol the visitor in a marketing sequence they never agreed to, and the first you hear of it is from your data protection officer.\n\nDetent Engage is the other thing. It is an assistant that is not allowed to lie, cannot act without consent, and writes down everything it does.","clip":"clips/01-marketing.webm"},{"n":2,"title":"Setting up an account","seat":"COO, CFO","audio":"audio/02-setup.mp3","shots":["shots/08-console-new-account.png"],"caption":"One form. Term, notice period, uplift, spend cap, limits.","text":"This is how a customer is set up. One form.\n\nLook at what it asks for, because this is the part every other revenue tool leaves out. Term: thirty-six months. Start date. Notice period: one hundred and eighty days. Renewal uplift: four and a half per cent. Monthly credits. A spend cap. Seats, conversations, voice minutes.\n\nMost systems capture the price and throw the contract away. The contract goes into a PDF, the PDF goes into a folder, and eighteen months later nobody can tell you when the notice window closes. Detent captures the commercial terms at the moment the account is created, because everything downstream, renewal, uplift, entitlement, the right to charge for overuse, is derived from them.\n\nOne form, and the customer exists with their contract attached.","clip":"clips/02-signin-and-setup.webm"},{"n":3,"title":"What that gives you","seat":"CFO, CRO","audio":"audio/03-contract.mp3","shots":["shots/13-console-account-contract.png"],"caption":"Notice deadline 2028-07-05, derived from the contract. Not typed in by anybody.","text":"Here is Northwind Logistics a moment later. Term, thirty-six months. Renews on the first of January 2029. Notice deadline: the fifth of July 2028, open.\n\nThat date is not in the contract. It is derived from the contract: renewal date, minus one hundred and eighty days. It is the date on which this revenue becomes at risk, and it is calculated, dated and shown without anybody remembering to work it out.\n\nRenewal uplift, four and a half per cent, sitting next to it. Spend cap, fifteen thousand pounds. Limits per period, with voice minutes and conversations metered against them.\n\nCFO: this is the answer to \"what are we entitled to charge, and when do we lose the right to ask\". Not a report you commission. A field on a screen.","clip":"clips/03-contract.webm"},{"n":4,"title":"Pricing that does not break the base","seat":"CFO","audio":"audio/04-pricing.mp3","shots":["shots/26-support-forbidden.png"],"caption":"Every subscription is pinned to the version it was sold on.","text":"Packaging, in the back office rather than in a deploy.\n\nRead the line at the top: changing a price here never changes what an existing customer pays. Every subscription is pinned to the version it was sold on and the fee it was contracted at. A customer moves only by a deliberate plan change, or at renewal with an agreed uplift.\n\nAnyone who has repriced a software base knows why that sentence matters. Editing a price list and silently repricing four hundred live contracts is a way to lose a year.\n\nNote also what the plan charges for: not seats, not messages, but a confirmed outcome. A booked meeting, or a qualified handover.","clip":"clips/04-pricing.webm"},{"n":5,"title":"Installation","seat":"COO, CIO","audio":"audio/05-install.mp3","shots":["shots/24-install-guide.png"],"caption":"One script tag. No tag manager project, no data layer.","text":"Installation is one script tag. That is the whole integration for the visitor-facing assistant. No tag manager project, no customer data platform, no data layer. The tenant's own knowledge is uploaded separately, and the assistant answers only from it.\n\nCOO: the question you are asking is how long before this is doing something. The answer is that setting up the account is the long part, and it is a form.","clip":"clips/05-install.webm"},{"n":6,"title":"A visitor arrives","seat":"CRO","audio":"audio/06-conversation.mp3","shots":["shots/22-widget-turn-1.png","shots/22-widget-turn-2.png","shots/22-widget-turn-3.png","shots/22-widget-turn-4.png","shots/22-widget-turn-5.png","shots/21-widget-open.png"],"caption":"The real panel, driven end to end. Disclosure first, every session.","conversation":[{"who":"assistant","audio":"audio/conv-00-disclosure.mp3","text":"Just so you know, you are speaking with an AI assistant, not a person. I can answer questions and arrange a call with the team."},{"who":"visitor","audio":"audio/conv-01-visitor.mp3","text":"We run forty vans out of two depots in the Midlands. Our telematics contract ends in March and I'm looking at replacing it."},{"who":"assistant","audio":"audio/conv-02-assistant.mp3","text":"Replacing a telematics contract at renewal is the easiest time to change, so your timing is good. Two depots and vans suggests you care about utilisation as much as location. How many vehicles are in scope?"},{"who":"visitor","audio":"audio/conv-03-visitor.mp3","text":"Forty vehicles, and we'd want driver behaviour scoring as well as tracking."},{"who":"assistant","audio":"audio/conv-04-assistant.mp3","text":"Forty vehicles with driver behaviour scoring puts you in the mid-fleet configuration rather than the enterprise one. I can give you the published band for that, but not a bespoke figure. Is the March date a hard stop, or is there a notice period that has to be served before it?"},{"who":"visitor","audio":"audio/conv-05-visitor.mp3","text":"There's a ninety day notice period before March, so it's tighter than it looks."},{"who":"assistant","audio":"audio/conv-06-assistant.mp3","text":"Then the decision has to be made before the notice window closes, not before the contract ends. That is usually the date that catches people out. Are you the person who signs this off, or does it go to a board?"},{"who":"visitor","audio":"audio/conv-07-visitor.mp3","text":"It's my call. I run the fleet."},{"who":"assistant","audio":"audio/conv-08-assistant.mp3","text":"Useful, thank you. On what you have told me, this is a fit and worth twenty minutes with the fleet team. They can walk through the behaviour scoring and what the migration from your current provider involves. What is the best work email for the invitation?"},{"who":"visitor","audio":"","text":"d.harper@northwind.example"},{"who":"assistant","audio":"audio/conv-09-assistant.mp3","text":"Booked. You will get a confirmation to that address with the slot, and a short note on what they will cover. Nothing else will be sent to you, and you have not been added to any marketing list."}],"text":"A visitor opens the panel. Before a single question, a disclosure: you are chatting with an AI assistant, not a person. Every session. Not a footnote, not a tooltip.\n\nHe says he runs forty vans out of two Midlands depots, and his telematics contract ends in March. Watch the assistant qualify. Scale. Requirement. Then this: \"Then the decision has to be made before the notice window closes, not before the contract ends. That is usually the date that catches people out.\"\n\nThat is not small talk. That is the single most valuable sentence in the conversation, and it is the same insight the back office calculates for your own contracts, pointed at the prospect's.\n\nThen authority. Then, and only then, the email address, because it asks for contact details after it has given something worth having. And at the end: nothing else will be sent to you, and you have not been added to any marketing list.","clip":"clips/06-conversation.webm"},{"n":7,"title":"Consent, not capture","seat":"CIO","audio":"audio/07-consent.mp3","shots":["shots/22-widget-turn-5.png","shots/23-widget-mobile-conversation.png","shots/20-widget-open-mobile.png"],"caption":"Identity resolution does not begin until the visitor answers. Not degraded. Refused.","text":"Underneath the conversation, the thing your CIO is looking for.\n\n\"May we check whether we already know you, so we can put you through to the right person?\" With a \"what does this mean\" explanation, a yes, a no, and a \"forget me\".\n\nIdentity resolution does not begin until that is answered. Not degraded, not deferred: refused. The assistant is told what it may do with a record; it is never given the record. And on a phone, it is the same panel and the same gate.","clip":"clips/07-mobile.webm"},{"n":8,"title":"The outcome","seat":"CRO","audio":"audio/08-outcome.mp3","json":["json/outcome-ledger.json","json/analytics.json"],"caption":"One outcome, confirmed and billable, with a link that replays the conversation that produced it.","text":"The conversation produced one thing that matters: an outcome. book_meeting, state CONFIRMED, billable true, with an evidence URL. That link replays the exact conversation that produced it.\n\nCRO: this is the difference between \"the chatbot had four hundred conversations\" and \"here is the meeting, here is why it qualified, here is the transcript\". The funnel underneath counts sessions, engaged, qualified, outcomes, meetings held, and how many arrived outside business hours.\n\nThat last number is the honest one. It is the pipeline you were not going to get."},{"n":9,"title":"Nobody moves money alone","seat":"CFO","audio":"audio/09-dual-control.mp3","shots":["shots/12-console-approvals.png","shots/28-approvals-after-approval.png","shots/29-account-after-approval.png"],"caption":"Two held. A second person approves one. The queue drops, and the credit lands.","text":"Two actions waiting. Two thousand five hundred pounds of promotional credit, and a spend cap going from five and a half to nine thousand. Each with the person who asked, the amount, and the reason in their own words.\n\nNeither has happened. Above a threshold no single person acts, whatever their role. An administrator is not a superuser here: they are the person most worth compromising.\n\nA second person approves. The queue drops to one, and the credit appears on the account.\n\nCFO: you cannot approve your own request, and you cannot approve an action you would not be permitted to take yourself. The threshold is five hundred pounds for a credit, two hundred and fifty for a refund, five thousand for a spend cap, and a plan override always needs two people whatever it is worth.","clip":"clips/09-dual-control.webm"},{"n":10,"title":"Who can do what","seat":"CIO, CFO","audio":"audio/10-roles.mp3","shots":["shots/25-support-cannot-move-money.png","shots/27-viewer-console.png"],"caption":"The same account, seen by support. Every money action greyed, with the reason on it.","text":"The same account, seen by the support team. They can see everything: the contract, the balance, what is overdue. Every money action is greyed. Hold dunning is not, because pausing a chase only ever helps a customer.\n\nAnd the pending approval shows \"Needs credit.grant\" instead of an Approve button, with the reason on it, because an operator who cannot see a control assumes the system is broken and asks a colleague to do it for them, which is exactly the behaviour dual control exists to prevent.\n\nTwo more things a CIO will ask. First: the greyed button is not the control. The endpoint behind it refuses the same request. Second: no role can move money at all until that person has enrolled a second factor. Not the billing team, not the administrator, not the owner. A password is one phishing email away from a refund to somebody else's card.\n\nAnd the owner role, which manages people, deliberately cannot move money, because whoever can add a user must not also be able to pay themselves.","clip":"clips/10-roles.webm"},{"n":11,"title":"Voice: what is real, what is a stand-in","seat":"CIO, COO","audio":"audio/11-voice.mp3","json":["json/session-text.json","json/session-voice.json"],"caption":"Same product, two modalities. The disclosure changes; the governance does not.","text":"A word on the voice you just heard, and I am going to be precise about this.\n\nOpen a session in voice modality and the disclosure changes, in spoken form: \"just so you know, you are speaking with an AI assistant\". Voice minutes are metered against the contract. Concurrent calls are capped. And there is always a text-only route out of the voice channel. All of that is live today.\n\nThe words the assistant spoke are not a performance. They are the words the governed pipeline actually produced in the conversation you have just watched. The voice carrying them is an ElevenLabs voice, standing in for the OpenAI Realtime voice being wired into the production build.\n\nAnd inside the voice component there is a guard that refuses to open a session in which the speech provider is allowed to answer on its own, because every spoken word has to come through the same governed pipeline as every typed one.\n\nThe controls came first. The microphone is being connected now."},{"n":12,"title":"The record","seat":"CIO, CFO","audio":"audio/12-audit.mp3","json":["json/audit.json","json/compliance.json"],"caption":"Nineteen entries, each carrying the hash of the one before it.","text":"Everything you have just seen, in one chain. Session opened. Disclosure shown. Tool executed. Outcome recorded. Credit requested. Approved, by a named second person. Executed. Granted.\n\nEach entry carries the hash of the one before it. Remove an entry, change an amount, and every hash after it stops matching. This is not a log file that somebody could edit. It is a chain that tells you whether it has been edited.\n\nAnd the compliance view: AI disclosure coverage, one hundred per cent. Identity resolutions blocked for consent. Marketing enrolments blocked. CRM disclosure denials. Those are not aspirations. They are counters.\n\nCIO: when your regulator, your insurer, or your largest customer's procurement team asks what your AI did, this is the answer, and it is generated, not written."},{"n":13,"title":"Who touches it","seat":"All","audio":"audio/13-personas.mp3","personas":true,"shots":["shots/15-app-overview.png","shots/11-console-resellers.png"],"caption":"Seven surfaces. Each person sees only their own.","text":"Seven people interact with this, and each sees only their own surface. The separations are the point: the person who opens a supplier account is not the person who pays it, and that principle is wired into the roles rather than written in a policy nobody reads.","clip":"clips/11-customer.webm"},{"n":14,"title":"What is true, and what is next","seat":"All","audio":"audio/14-close.mp3","shots":["shots/03-trust.png","shots/04-assurance.png"],"caption":"The trust and assurance pages, generated from the platform rather than written by marketing.","text":"I will end where a demonstration usually does not, which is with the gaps.\n\nLive and verified: the governance pipeline, consent, disclosure, the outcome ledger, contract terms and notice calculation, dual control, role and multi-factor gating, the hash-chained audit, one tenant per row enforced by the database rather than by the application, and no card number anywhere in the platform.\n\nNot yet: the speech channel is being connected in the production build. The platform's own audit chain and spend counters run in memory until the durable adapters are wired, which is the last piece before a pilot. There is no screen for managing console users, so roles are set by an administrator. And the assistant's wording in this recording came from a deterministic script rather than from a model, because this build was recorded without a model key. The governance you saw is real; the phrasing is fixed.\n\nEverything on that second list is scheduled. Everything on the first list, you have just watched happen.","clip":"clips/14-assurance.webm"}],"personas":[{"who":"Visitor","surface":"The panel on the customer's site","can":"Ask, consent or refuse, book, be forgotten","cannot":"Be identified before they consent; be enrolled in marketing"},{"who":"Customer owner \u2014 Dan Harper, Northwind","surface":"Detent Manage","can":"Plan, usage, renewal, notice, credit; install; upload knowledge","cannot":"See another tenant; see Detent's back office"},{"who":"Customer member \u2014 Joy Okafor","surface":"Detent Manage","can":"Day-to-day use within the tenant","cannot":"Billing and contract changes"},{"who":"Detent support \u2014 Saada Ibrahim","surface":"Back office","can":"See any account, pause a chase","cannot":"Move money; approve"},{"who":"Detent billing \u2014 Marcus Whitlock","surface":"Back office","can":"Credits, invoices, payments, refunds, onboard a customer","cannot":"Change a spend cap, override a plan, manage users"},{"who":"Detent commercial \u2014 Grace Aldridge","surface":"Back office","can":"Plan overrides, spend caps, write-offs, approvals","cannot":"Manage users"},{"who":"Detent owner \u2014 operations","surface":"Back office","can":"Manage people and roles, approve","cannot":"Move money \u2014 deliberately"},{"who":"Reseller","surface":"Partner portal","can":"Their own book, their own commission","cannot":"Any customer that is not theirs"}],"voices":{"narrator":"Jim Executive (ElevenLabs) \u2014 the narrator, not the product","assistant":"Eryn (ElevenLabs) \u2014 standing in for the OpenAI Realtime voice being wired into the production build","visitor":"Ali (ElevenLabs) \u2014 Dan Harper, fleet manager at Northwind Logistics"},"json":{"audit":{"entries_total":19,"shown":[{"sequence":1,"type":"policy_allowed","actor":"tenant_admin","recordedAt":"2026-09-20T08:15:44.222Z","payload":{"change":"dpa_recorded","reference":"DPA-DEV"},"previousHash":"000000000000000000000000\u2026","hash":"46e1baa57718045b38d0750d\u2026"},{"sequence":13,"type":"tool_call_executed","actor":"system","recordedAt":"2026-09-20T08:16:29.549Z","payload":{"change":"outcome_recorded","outcome":"book_meeting","billable":true,"state":"CONFIRMED"},"previousHash":"5d5331e782c1e30af0493fae\u2026","hash":"0a5350ab5f9dcdaa60542b33\u2026"},{"sequence":14,"type":"tool_call_executed","actor":"system","recordedAt":"2026-09-20T08:16:29.549Z","payload":{"tool":"record_outcome","parked":false},"previousHash":"0a5350ab5f9dcdaa60542b33\u2026","hash":"83acda191e504db24a4c9886\u2026"},{"sequence":15,"type":"session_opened","actor":"system","recordedAt":"2026-09-20T08:16:31.938Z","payload":{"modality":"text","jurisdiction":"UK","state":"LIVE"},"previousHash":"83acda191e504db24a4c9886\u2026","hash":"4969ba22a809228ab37f9f24\u2026"},{"sequence":16,"type":"disclosure_shown","actor":"system","recordedAt":"2026-09-20T08:16:33.700Z","payload":{"modality":"text","wording":"You are chatting with an AI assistant, not a person. It can answer questions and arrange a call with the team."},"previousHash":"4969ba22a809228ab37f9f24\u2026","hash":"95c6db79250cca112f312328\u2026"},{"sequence":17,"type":"operator_action_approved","actor":"platform_admin","recordedAt":"2026-09-20T08:16:52.696Z","payload":{"capability":"credit.grant","approvedBy":"usr_2cXV8L7o3mwd","requestedBy":"usr_Pr5ZFqloZAP3","fingerprint":"5f8bc157"},"previousHash":"95c6db79250cca112f312328\u2026","hash":"51876d2bdadaac12be8b548d\u2026"},{"sequence":18,"type":"operator_action_executed","actor":"platform_admin","recordedAt":"2026-09-20T08:16:52.696Z","payload":{"capability":"credit.grant","requestedBy":"usr_Pr5ZFqloZAP3","approvedBy":"usr_2cXV8L7o3mwd","fingerprint":"5f8bc157","amount":"\u00a32,500.00"},"previousHash":"51876d2bdadaac12be8b548d\u2026","hash":"dbb664e6de6c0086514d4627\u2026"},{"sequence":19,"type":"credit_granted","actor":"platform_admin","recordedAt":"2026-09-20T08:16:52.699Z","payload":{"accountId":"acc_F8YkxNCwVSA","amount":250000,"currency":"GBP","kind":"grant_promotional","reason":"Agreed at the Q3 business review as the migration incentive.","requestedBy":"usr_Pr5ZFqloZAP3","approvedBy":"usr_2cXV8L7o3mwd","executedBy":"usr_2cXV8L7o3mwd"},"previousHash":"dbb664e6de6c0086514d4627\u2026","hash":"aeee5e2b76ac735cbf9e2a1c\u2026"}]},"outcome-ledger":{"window":{"from":"0000-01-01T00:00:00.000Z","to":"9999-12-31T23:59:59.999Z"},"billable":1,"rows":[{"correlation_id":"corr_01M2YY6BWX6YSK0P572Z4AANAS","outcome":"book_meeting","state":"CONFIRMED","billable":true,"recorded_at":"2026-09-20T08:16:29.549Z","confirmed_at":"2026-09-20T08:16:29.549Z","evidence_url":"/v1/admin/tenants/t_northwind/replay?correlation_id=corr_01M2YY6BWX6YSK0P572Z4AANAS"}]},"analytics":{"headline":{"meetings_held":1,"qualified_leads":1,"deflection_rate_pct":100,"implied_hours_saved":0.6,"outside_business_hours_sessions":0},"funnel":{"sessions":3,"engaged":1,"qualified":1,"outcomes":1,"heldMeetings":1,"engagementRatePct":33.3,"qualificationRatePct":100}},"compliance":{"tenantId":"t_northwind","consentEvents":[],"identityResolutionsBlockedForConsent":0,"identityResolutionsPerformed":0,"marketingEnrolmentsBlocked":0,"crmDisclosureDenials":0,"sessionsOpened":3,"sessionsWithDisclosure":2,"aiDisclosureCoveragePct":66.7,"recordingConsent":{"granted":0,"refused":0,"notOffered":0},"erasureRequests":{"received":0,"completed":0},"injectionAttemptsRefused":0,"crossTenantDenials":0,"outputsBlocked":0,"evidence":{"auditEntriesExamined":19,"chainVerified":true}},"session-text":{"session_id":"sess_01M2YYRMCR0GDWAPBWSABE5ZK5","disclosure":"You are chatting with an AI assistant, not a person. It can answer questions and arrange a call with the team.","modality":"text","text_only_route_available":true,"kill_switch":"OFF","locale":"en-GB","branding":{"launcherPosition":"bottom-right"},"streaming_available":true,"max_input_chars":4000},"session-voice":{"session_id":"sess_01M2YYRMDRT9QPCMH8NPEF68HG","disclosure":"Just so you know, you are speaking with an AI assistant, not a person. I can answer questions and arrange a call with the team.","modality":"voice","text_only_route_available":true,"kill_switch":"OFF","locale":"en-GB","branding":{"launcherPosition":"bottom-right"},"streaming_available":true,"max_input_chars":4000}}};</script>
<script>
(function () {
  'use strict';
  var D = window.__DEMO__;
  var scenes = D.scenes, personas = D.personas, JSONS = D.json;
  var i = 0, shot = 0;
  var audio = new Audio();
  var currentButton = null;

  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  /* Emphasis is authored in the narration with *asterisks*, so the copy stays
     readable in the script file the player shares with the repository. */
  function para(text) {
    return text.split('\n\n').map(function (p) {
      return '<p>' + esc(p).replace(/\*([^*]+)\*/g, '<em>$1</em>') + '</p>';
    }).join('');
  }

  /* A small pretty-printer rather than a library: the payloads are tiny and
     fixed, and colouring keys and strings is the whole requirement. */
  function renderJson(value) {
    return esc(JSON.stringify(value, null, 1))
      .replace(/&quot;([^&]*?)&quot;:/g, '<b>&quot;$1&quot;</b>:')
      .replace(/: &quot;([^&]*?)&quot;/g, ': <i>&quot;$1&quot;</i>');
  }

  function buildRail() {
    el('rail').innerHTML = scenes.map(function (s, n) {
      return '<li><button class="scene" type="button" data-i="' + n + '">' +
        '<span class="num">' + String(s.n).padStart(2, '0') + '</span>' +
        '<span>' + esc(s.title) + '<span class="seat">' + esc(s.seat) + '</span></span>' +
        '</button></li>';
    }).join('');
    el('rail').addEventListener('click', function (e) {
      var b = e.target.closest('button.scene');
      if (b) go(Number(b.dataset.i));
    });
  }

  function personaTable() {
    return '<div class="tablewrap"><table class="personas">' +
      '<thead><tr><th>Persona</th><th>Surface</th><th>May</th><th>May not</th></tr></thead><tbody>' +
      personas.map(function (p) {
        return '<tr><td class="who">' + esc(p.who) + '</td><td>' + esc(p.surface) +
          '</td><td class="can">' + esc(p.can) + '</td><td class="cannot">' + esc(p.cannot) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function conversation(turns) {
    return '<div class="turns">' + turns.map(function (t, n) {
      var has = Boolean(t.audio);
      return '<div class="turn ' + t.who + '">' +
        '<button class="play" type="button" data-src="' + esc(t.audio) + '" data-line="' + n + '"' +
        (has ? '' : ' disabled title="No clip for this line"') + ' aria-label="Play this line">▶</button>' +
        '<div class="bubble"><span class="who">' +
        (t.who === 'assistant' ? 'Assistant' : 'Dan Harper') + '</span>' + esc(t.text) + '</div></div>';
    }).join('') + '</div>';
  }

  function stillsMarkup(s) {
    return '<div class="viewer"><div class="frame"><img id="mainshot" alt="' +
      esc(s.caption || s.title) + '" src="' + esc(s.shots[0]) + '"></div>' +
      '<div class="caption">' + esc(s.caption || '') + '</div></div>';
  }

  function thumbsMarkup(s) {
    return s.shots.length > 1 ? s.shots.map(function (src, n) {
      return '<button type="button" data-shot="' + n + '" data-n="' + (n + 1) +
        '" aria-label="Screen ' + (n + 1) + '"><img alt="" src="' + esc(src) + '"></button>';
    }).join('') : '';
  }

  /** A clip that will not decode leaves the scene on its screenshots. */
  function fallBackToStills(s) {
    if (!s.shots || !s.shots.length) return;
    el('visual').innerHTML = stillsMarkup(s);
    el('thumbs').innerHTML = thumbsMarkup(s);
    el('replay').hidden = true;
    setShot(0);
  }

  function render() {
    var s = scenes[i];
    shot = 0;

    el('sceneNum').textContent = String(s.n).padStart(2, '0') + ' / ' + scenes.length;
    el('sceneTitle').textContent = s.title;
    el('sceneSeat').textContent = s.seat;
    el('now').innerHTML = '<b>' + esc(s.title) + '</b>';
    el('replay').hidden = !s.clip;

    Array.prototype.forEach.call(document.querySelectorAll('button.scene'), function (b, n) {
      b.setAttribute('aria-current', n === i ? 'true' : 'false');
    });

    var visual = el('visual'), thumbs = el('thumbs');
    if (s.clip) {
      /* A recording of the product being used. Muted and looping: the room's
         audio is the narration, and a clip that stops on its last frame turns
         a live demonstration back into a screenshot while somebody is still
         talking over it. */
      visual.innerHTML = '<div class="viewer"><div class="frame film">' +
        '<video id="film" autoplay muted loop playsinline preload="auto"' +
        (s.shots && s.shots.length ? ' poster="' + esc(s.shots[0]) + '"' : '') +
        '><source src="' + esc(s.clip) + '" type="video/webm"></video></div>' +
        '<div class="caption"><span class="live">Live</span>' + esc(s.caption || '') + '</div></div>';
      thumbs.innerHTML = '';
      document.getElementById('film').addEventListener('error', function () { fallBackToStills(s); });
    } else if (s.shots && s.shots.length) {
      visual.innerHTML = stillsMarkup(s);
      thumbs.innerHTML = thumbsMarkup(s);
      setShot(0);
    } else if (s.json) {
      thumbs.innerHTML = '';
      visual.innerHTML = s.json.map(function (path) {
        var key = path.replace('json/', '').replace('.json', '');
        return '<p class="jsonlabel">' + esc(path) + '</p><pre class="json">' +
          renderJson(JSONS[key]) + '</pre>';
      }).join('') + '<p class="caption" style="border:0;background:none;padding:0">' +
        esc(s.caption || '') + '</p>';
    } else {
      thumbs.innerHTML = '';
      visual.innerHTML = '';
    }

    el('narration').innerHTML = para(s.text);

    var aside = '';
    if (s.conversation) {
      aside = '<div class="aside"><h3>Spoken, in the room</h3>' + conversation(s.conversation) +
        '<p class="notice" style="margin-top:14px">The assistant’s voice is a stand-in for the ' +
        'OpenAI Realtime voice being wired into the production build. The words are the ones the ' +
        'governed pipeline produced.</p></div>';
    }
    el('aside').innerHTML = aside;
    if (s.personas) el('narration').insertAdjacentHTML('beforeend', personaTable());

    stop();
  }

  function setShot(n) {
    var s = scenes[i];
    if (!s.shots || !s.shots.length) return;
    shot = (n + s.shots.length) % s.shots.length;
    var img = document.getElementById('mainshot');
    if (img) { img.src = s.shots[shot]; img.parentElement.scrollTop = 0; }
    Array.prototype.forEach.call(el('thumbs').querySelectorAll('button'), function (b, k) {
      b.setAttribute('aria-current', k === shot ? 'true' : 'false');
    });
  }

  function stop() {
    audio.pause();
    el('play').textContent = '▶ Play narration';
    el('bar').style.width = '0';
    if (currentButton) { currentButton.dataset.state = ''; currentButton.textContent = '▶'; }
    currentButton = null;
  }

  /* Audio is optional by design. The clips are generated separately and
     dropped into audio/; until they are there every control still works and
     the page says plainly which track is missing rather than failing
     silently on a click. */
  function play(src, button) {
    if (!src) return;
    stop();
    audio.src = src;
    currentButton = button || null;
    audio.play().then(function () {
      if (button) { button.dataset.state = 'playing'; button.textContent = '❚❚'; }
      else el('play').textContent = '❚❚ Pause';
    }).catch(function () {
      if (!el('audiomsg')) {
        el('narration').insertAdjacentHTML('afterbegin',
          '<p class="audiomsg" id="audiomsg">No audio track at <code>' + esc(src) +
          '</code>. The narration below is the same script, word for word.</p>');
      }
      stop();
    });
  }

  audio.addEventListener('timeupdate', function () {
    if (!audio.duration) return;
    el('bar').style.width = (audio.currentTime / audio.duration * 100) + '%';
  });
  audio.addEventListener('ended', stop);

  function go(n) {
    i = (n + scenes.length) % scenes.length;
    render();
    window.scrollTo(0, 0);
  }

  el('prev').addEventListener('click', function () { go(i - 1); });
  el('next').addEventListener('click', function () { go(i + 1); });
  el('replay').addEventListener('click', function () {
    var film = document.getElementById('film');
    if (film) { film.currentTime = 0; film.play(); }
  });
  el('play').addEventListener('click', function () {
    if (!audio.paused) { stop(); return; }
    play(scenes[i].audio, null);
  });
  el('thumbs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-shot]');
    if (b) setShot(Number(b.dataset.shot));
  });
  el('aside').addEventListener('click', function (e) {
    var b = e.target.closest('button.play');
    if (!b || b.disabled) return;
    if (b === currentButton && !audio.paused) { stop(); return; }
    play(b.dataset.src, b);
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(i - 1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setShot(shot + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setShot(shot - 1); }
    else if (e.key === ' ') { e.preventDefault(); el('play').click(); }
  });

  buildRail();
  render();
})();

</script>
